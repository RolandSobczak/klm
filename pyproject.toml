[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klm"
version = "0.1.0.dev0"
description = "KiCad Library Manager — parts, libraries, sourcing and fabrication for KiCad projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roland Sobczak" }]
keywords = ["kicad", "pcb", "electronics", "bom", "library"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

# The core has no runtime dependencies beyond the standard library, and that is
# load-bearing rather than fastidious: the S-expression layer must not depend on
# anything that could change its output, and `klm verify --clean-room` has to run
# on a machine with nothing installed. The desktop app is an extra, so
# `pip install klm` remains a complete installation.
dependencies = []

[project.optional-dependencies]
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    # The app extra plus what its test client needs, so `pip install -e .[dev]`
    # runs the whole suite rather than skipping the API tests silently.
    "klm[app]",
    "httpx2",
]

[project.scripts]
klm = "klm.cli.main:main"

[project.urls]
Repository = "https://github.com/RolandSobczak/klm"

[tool.hatch.build.targets.wheel]
packages = ["src/klm"]
# The UI is data, not code: plain files with no build step (docs/adr/0012).
artifacts = ["src/klm/api/static/*"]

# `cad/scripts/` runs under FreeCAD's interpreter, not klm's, so it is not a
# Python package and must not be importable. It still has to ship, or an
# installed klm cannot convert a mesh.
[tool.hatch.build.targets.wheel.force-include]
"cad" = "klm/_cad"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/klm"]
