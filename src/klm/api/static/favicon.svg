<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>klm</title>
  <!--
    The tab icon, drawn rather than scaled.

    The application icon (logo.png) is a detailed board: traces, a QFN, pad
    arrays, a wordmark. At 16 pixels all of that averages to a green square, so
    this keeps only the two things that survive: the board it sits on, and the
    database cylinder that says what klm is. Four traces converging on the
    cylinder carry the idea that the catalog is what the board is made of.

    SVG rather than a PNG set: it is a few hundred bytes, stays sharp on every
    display, and there is no build step to keep it in step with anything.
  -->
  <rect width="32" height="32" rx="7" fill="#1f6b45"/>

  <!-- Traces. Thick enough to survive a 16-pixel downscale; four rather than a
       plausible layout, because a real layout turns to noise at that size. -->
  <g stroke="#d9b45a" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M3 9h6l3 3"/>
    <path d="M29 9h-6l-3 3"/>
    <path d="M3 24h7"/>
    <path d="M29 24h-7"/>
  </g>
  <g fill="#d9b45a">
    <circle cx="3.5" cy="9" r="1.6"/>
    <circle cx="28.5" cy="9" r="1.6"/>
  </g>

  <!-- The cylinder: two ellipses and the body between them. Three bands read as
       a smudge below about 24 pixels, so there are two. -->
  <g fill="#eef1f4" stroke="#9aa4ad" stroke-width="0.9">
    <path d="M10 11.5v9c0 1.9 2.7 3.2 6 3.2s6-1.3 6-3.2v-9z"/>
    <ellipse cx="16" cy="11.5" rx="6" ry="3.2"/>
  </g>
  <path d="M10 16.5c0 1.9 2.7 3.2 6 3.2s6-1.3 6-3.2" fill="none"
        stroke="#9aa4ad" stroke-width="0.9"/>
</svg>
