<!doctype html>
<meta charset="utf-8">
<title>klm</title>
<!-- The simplified mark for the tab, the full artwork as the fallback: at 16px
     the detailed board averages to a green square. Browsers that understand SVG
     take the first line and ignore the second. -->
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/static/logo.png">
<link rel="stylesheet" href="/static/app.css">
<header>
  <!-- The heading is the text, always. The mark sits beside it and is hidden if
       the asset is not installed, so a stripped checkout shows a title rather
       than a broken-image glyph. -->
  <img id="logo" src="/static/logo.png" alt="" onerror="this.remove()">
  <h1>klm</h1>
  <nav id="tabs">
    <button data-view="catalog" class="on">Catalog</button>
    <button data-view="project">Project</button>
    <button data-view="orders">Ordering</button>
    <button data-view="stock">Inventory</button>
    <button data-view="health">Health</button>
  </nav>
</header>

<main>
  <section id="catalog" class="view on">
    <div class="bar">
      <input id="search" placeholder="Search MPN, manufacturer, description">
      <select id="status">
        <option value="">every status</option>
        <option value="draft">draft</option>
        <option value="approved">approved</option>
        <option value="deprecated">deprecated</option>
      </select>
      <button id="add-open">Add part</button>
      <button id="generate">Rebuild libraries</button>
    </div>
    <div class="split">
      <table id="parts"><thead><tr><th>MPN<th>Manufacturer<th>Package<th>Status</thead><tbody></tbody></table>
      <aside id="detail"><p class="muted">Select a part.</p></aside>
    </div>
  </section>

  <dialog id="add">
    <form id="add-form" method="dialog">
      <h2>Add a part</h2>
      <p class="muted">klm fills what it can find and reports what it cannot.
        The result is a <strong>draft</strong> — nothing is approved automatically.</p>
      <label>MPN <input name="mpn" required autofocus placeholder="STM32G031K8T6"></label>
      <label>Manufacturer <input name="manufacturer" placeholder="left blank if unknown"></label>
      <label>Category <input name="category" placeholder="IC/Microcontroller"></label>
      <label>Package <input name="package" placeholder="0402, LQFP-32"></label>
      <label>Value <input name="value" placeholder="10k, 100nF — passives only"></label>
      <label>LCSC part <input name="lcsc" placeholder="C8734 — entered by hand, see ADR-0009"></label>
      <label>Datasheet <input name="datasheet" placeholder="URL of the PDF"></label>
      <label class="check"><input type="checkbox" name="offline"> Do not contact suppliers</label>
      <div class="bar">
        <button value="add" id="add-submit">Add</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="diff"><div id="diff-body"></div>
    <div class="bar"><button id="diff-close">Close</button></div>
  </dialog>

  <section id="project" class="view">
    <div class="bar">
      <input id="project-path" placeholder="/home/you/pcb/my-board" size="46">
      <button id="project-open">Open</button>
      <button id="project-vendor">Vendor</button>
      <button id="project-verify">Verify (clean room)</button>
    </div>
    <div id="project-body"><p class="muted">Open a KiCad project directory.</p></div>
  </section>

  <section id="orders" class="view">
    <div class="bar">
      <input id="build" placeholder="5x my-board:full, 2x psu-board" size="34">
      <input id="projects-root" placeholder="projects directory" size="26">
      <button id="plan">Plan order</button>
    </div>
    <div id="orders-body"><p class="muted">Describe what you are building.</p></div>
  </section>

  <section id="stock" class="view">
    <div class="bar"><input id="location" placeholder="Cabinet A/*"><button id="stock-load">Show</button></div>
    <div id="stock-body"></div>
  </section>

  <section id="health" class="view"><div id="health-body"></div></section>
</main>

<div id="jobs"></div>
<script src="/static/app.js"></script>
